<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background glow -->
  <rect width="64" height="64" rx="16" fill="#1e2530"/>
  
  <!-- CRT Monitor Body (Retro Lo-Fi Anime Style) -->
  <rect x="10" y="8" width="44" height="36" rx="6" fill="#f5eedb" stroke="#3a4454" stroke-width="2.5"/>
  
  <!-- CRT Inner Screen Bezel -->
  <rect x="15" y="13" width="34" height="26" rx="3" fill="#182026" stroke="#3a4454" stroke-width="1.5"/>
  
  <!-- Screen Glow and Rain / Scanlines -->
  <rect x="17" y="15" width="30" height="22" rx="2" fill="#1c2e28"/>
  <line x1="17" y1="20" x2="47" y2="20" stroke="#264238" stroke-width="1"/>
  <line x1="17" y1="26" x2="47" y2="26" stroke="#264238" stroke-width="1"/>
  <line x1="17" y1="32" x2="47" y2="32" stroke="#264238" stroke-width="1"/>

  <!-- Anime Pixel Terminal Prompt / Heart -->
  <text x="20" y="27" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399">&gt;_</text>
  <circle cx="42" cy="22" r="2.5" fill="#f87171"/>
  
  <!-- Power LED & Knobs -->
  <circle cx="43" cy="40" r="1.5" fill="#fbbf24"/>
  <circle cx="38" cy="40" r="1.2" fill="#94a3b8"/>
  
  <!-- Monitor Stand Neck -->
  <rect x="26" y="44" width="12" height="6" fill="#dcd3c1" stroke="#3a4454" stroke-width="1.5"/>
  <!-- Monitor Stand Base -->
  <polygon points="18,55 46,55 42,50 22,50" fill="#eedcc4" stroke="#3a4454" stroke-width="1.5"/>
  
  <!-- Tiny Cute Desk Plant / Mug -->
  <rect x="48" y="47" width="8" height="8" rx="2" fill="#e27d60"/>
  <ellipse cx="52" cy="45" rx="3" ry="4" fill="#84a98c"/>
</svg>